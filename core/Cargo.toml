[package]
name = "oracle-core"
version = "2.0.1"
authors = [
    "Robert Kornacki <11645932+robkorn@users.noreply.github.com>",
    "@greenhat",
    "@kettlebell",
    "@SethDusek",
    "@kushti",
]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yaml-rust = "0.4.4"
reqwest = { version = "0.11.27", features = ["blocking"] }
url = { version = "2.5.4", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.27"
json = "0.12.4"
serde_json = "1.0.140"
thiserror = "1.0.69"
anyhow = "1.0.97"
base16 = "0.2.1"
base64 = "0.13.1"
log = "0.4.27"
log-panics = "2.1.0"
log4rs = "1.3.0"
crossbeam = "0.8.4"
tokio = { version = "1.44.1", features = ["full"] }
tower-http = { version = "0.3.5", features = ["cors"] }
axum = "0.6.20"
ergo-lib = { workspace = true }
ergo-node-interface = { version = "0.5.0" }
derive_more = "0.99.19"
clap = { version = "4.5.35", features = ["derive"] }
exitcode = "1.1.2"
lazy_static = "1.5.0"
once_cell = "1.21.3"
futures = "0.3.31"
prometheus = "0.13.4"

[dev-dependencies]
ergo-lib = { workspace = true, features = ["arbitrary"] }
proptest = { version = "1.0.0" }
sigma-test-util = { version = "0.3.0" }
ergo-chain-sim = { version = "0.1.0", path = "../ergo-chain-sim" }
env_logger = { version = "0.10.2" }
tokio-test = { version = "0.4.4" }
